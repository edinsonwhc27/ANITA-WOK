<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina / Recepción</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .brand-header {
      background-color: #1f1f1f;
      padding: 12px 20px;
      border-bottom: 2px solid #d32f2f;
    }

    .comanda-card {
      background-color: #1e1e1e;
      border: 2px solid #d32f2f;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(211, 47, 47, 0.2);
    }

    .comanda-header {
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .item-plato {
      font-size: 1.1rem;
      font-weight: 600;
      border-bottom: 1px dashed #333;
      padding: 6px 0;
    }

    .item-obs {
      font-size: 0.85rem;
      color: #ffca28;
      font-weight: normal;
      display: block;
    }

    .badge-metodo {
      font-size: 0.8rem;
      background-color: #198754;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Encabezado de Cocina -->
  <header class="brand-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <h1 class="h4 mb-0 fw-bold text-danger"><i class="fa-solid fa-utensils me-2"></i> ANITA-WOK — COCINA</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <!-- BOTÓN PARA ACTIVAR/DESBLOQUEAR EL SONIDO EN EL NAVEGADOR -->
      <button id="btn-activar-sonido" class="btn btn-warning btn-sm fw-bold" onclick="activarAudio()">
        <i class="fa-solid fa-volume-high me-1"></i> Activar Sonido Alerta
      </button>
      <a href="/index.html" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-receipt me-1"></i> Ir a Caza / Comandas
      </a>
    </div>
  </header>

  <div class="container-fluid p-3">
    <!-- Grid donde se cargan las comandas -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3" id="contenedor-comandas">
      <div class="col-12 text-center py-5 text-muted" id="mensaje-vacio">
        <h4><i class="fa-solid fa-clock me-2"></i> Esperando nuevas comandas...</h4>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    let audioPermitido = false;

    // Sintetizador Web Audio API para generar un "pitido" sonoro limpio sin depender de archivos de audio externos
    function emitirPitido() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine'; // Tono tipo pitido
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Frecuencia de 880Hz (Nota La/A5)
        
        // Volumen y duración del pitido (2 pitidos cortos)
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.4);

        // Segundo pitido
        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // Nota C6
          gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.5);
        }, 200);

      } catch (e) {
        console.error("Error al reproducir el pitido:", e);
      }
    }

    // Función para activar el audio al hacer clic por primera vez
    function activarAudio() {
      audioPermitido = true;
      emitirPitido(); // Emite un pitido de prueba
      const btn = document.getElementById('btn-activar-sonido');
      if (btn) {
        btn.className = "btn btn-success btn-sm fw-bold";
        btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Sonido Activado';
      }
    }

    // Escuchar la llegada de una nueva comanda desde el servidor
    socket.on('nuevaComanda', (comanda) => {
      console.log("Nueva comanda recibida:", comanda);

      // Reproducir sonido si fue activado
      if (audioPermitido) {
        emitirPitido();
      }

      // Ocultar mensaje de espera
      const msgVacio = document.getElementById('mensaje-vacio');
      if (msgVacio) msgVacio.style.display = 'none';

      // Construir tarjeta de comanda
      const contenedor = document.getElementById('contenedor-comandas');
      const col = document.createElement('div');
      col.className = 'col';
      col.id = `comanda-${comanda.id}`;

      let itemsHTML = '';
      comanda.items.forEach(item => {
        itemsHTML += `
          <div class="item-plato">
            <span class="badge bg-danger text-white me-1">${item.cantidad}x</span> ${item.nombre}
            ${item.observacion ? `<span class="item-obs"><i class="fa-solid fa-comment-dots me-1"></i>${item.observacion}</span>` : ''}
          </div>
        `;
      });

      let datosCliente = '';
      if (comanda.cliente && comanda.cliente.nombre) {
        datosCliente = `
          <div class="small text-info mt-2 pt-1 border-top border-secondary">
            <strong><i class="fa-solid fa-user me-1"></i>${comanda.cliente.nombre}</strong> 
            ${comanda.cliente.telefono ? `(${comanda.cliente.telefono})` : ''}<br>
            ${comanda.cliente.direccion ? `<i class="fa-solid fa-location-dot me-1"></i>${comanda.cliente.direccion}` : ''}
          </div>
        `;
      }

      col.innerHTML = `
        <div class="comanda-card">
          <div class="comanda-header d-flex justify-content-between align-items-center">
            <div>
              <span class="h5 fw-bold text-warning mb-0">${comanda.mesa}</span>
              <small class="text-muted d-block">${comanda.fecha}</small>
            </div>
            <span class="badge-metodo">${comanda.metodoPago}</span>
          </div>

          <div class="comanda-body">
            ${itemsHTML}
            ${datosCliente}
          </div>

          <div class="mt-3 pt-2 border-top border-secondary d-flex justify-content-between align-items-center">
            <span class="fw-bold text-white">Total: S/ ${comanda.total.toFixed(2)}</span>
            <button class="btn btn-sm btn-success fw-bold" onclick="despacharComanda('${comanda.id}')">
              <i class="fa-solid fa-check me-1"></i> Listo
            </button>
          </div>
        </div>
      `;

      // Insertar la comanda al inicio
      contenedor.insertBefore(col, contenedor.firstChild);
    });

    // Función para marcar como despachada/lista la comanda
    function despacharComanda(id) {
      const elem = document.getElementById(`comanda-${id}`);
      if (elem) {
        elem.remove();
      }

      const contenedor = document.getElementById('contenedor-comandas');
      if (contenedor.children.length === 1 && document.getElementById('mensaje-vacio')) {
        document.getElementById('mensaje-vacio').style.display = 'block';
      }
    }
  </script>
</body>
</html>
