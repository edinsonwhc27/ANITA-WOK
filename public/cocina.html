<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina Moderna</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Paleta Principal: Negro (#121212), Rojo (#d32f2f), Beige (#f5f5dc), Verde (#2e7d32), Amarillo (#f59e0b) */
    body {
      background-color: #121212;
      color: #f5f5dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Header Rojo con letras Beige */
    .brand-header-cocina {
      background-color: #d32f2f;
      color: #f5f5dc;
      padding: 10px 20px;
      border-bottom: 2px solid #b71c1c;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Panel Acumulado de Producción (Marco Beige y Fondo Antracita) */
    .panel-acumulado {
      background-color: #1e1e1e;
      border: 2px solid #f5f5dc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .badge-platillo {
      font-size: 1.05rem;
      padding: 8px 14px;
      border-radius: 8px;
      background-color: #2a2a2a;
      border: 1px solid #f59e0b; /* Borde amarillo cálido */
      color: #f5f5dc;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Tarjetas de Pedidos Individuales */
    .card-pedido {
      background-color: #1e1e1e;
      border-radius: 10px;
      border: 2px solid #333;
      transition: transform 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .card-pedido:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    /* Semáforo de Tiempo */
    .tiempo-normal { border-color: #2e7d32 !important; } /* Verde < 10 min */
    .tiempo-alerta { border-color: #f59e0b !important; } /* Amarillo 10-15 min */
    .tiempo-urgente { border-color: #d32f2f !important; animation: parpadeo 1.5s infinite; } /* Rojo > 15 min */

    @keyframes parpadeo {
      0% { box-shadow: 0 0 5px #d32f2f; }
      50% { box-shadow: 0 0 18px #d32f2f; }
      100% { box-shadow: 0 0 5px #d32f2f; }
    }

    /* Lista de ítems de comanda */
    .item-plato {
      background-color: #262626;
      color: #f5f5dc;
      border-color: #383838;
      transition: all 0.2s;
    }

    .item-plato:hover {
      background-color: #303030;
    }

    /* Estilo al Tachar un Plato completado */
    .tachado {
      text-decoration: line-through;
      opacity: 0.45;
      background-color: #2e7d32 !important; /* Verde al completar */
      color: #ffffff !important;
    }

    /* Reglas para Impresión de Oficina */
    @media print {
      body * { visibility: hidden; }
      .ticket-print, .ticket-print * { visibility: visible; }
      .ticket-print { position: absolute; left: 0; top: 0; width: 80mm; color: black !important; font-family: monospace; font-size: 12px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body onclick="activarAudio()">

  <!-- Encabezado Rojo y Beige -->
  <header class="brand-header-cocina d-flex justify-content-between align-items-center no-print">
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid fa-fire-burner fs-4"></i>
      <h1 class="h5 mb-0 fw-bold text-uppercase" style="letter-spacing: 1px;">ANITA-WOK — Cocina</h1>
    </div>
    <div>
      <span id="estado-audio" class="badge bg-warning text-dark me-2" style="font-size:0.75rem;">Clic en pantalla para activar sonido</span>
      <a href="/index.html" class="btn btn-sm fw-bold" style="background-color: #f5f5dc; color: #d32f2f;">
        <i class="fa-solid fa-receipt me-1"></i> Ir a Pedidos
      </a>
    </div>
  </header>

  <div class="container-fluid p-3 no-print">
    
    <!-- 1. RESUMEN EN VIVO DE PLATOS ACUMULADOS (BEIGE Y AMARILLO) -->
    <div class="panel-acumulado">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 mb-0 fw-bold text-uppercase" style="color: #f59e0b; letter-spacing: 0.5px;">
          <i class="fa-solid fa-layer-group me-2"></i>Producción Acumulada en Wok
        </h2>
        <span class="badge" id="total-comandas-activas" style="background-color: #f5f5dc; color: #121212; font-weight: bold;">0 comandas activas</span>
      </div>
      <div id="contenedor-acumulado" class="d-flex flex-wrap gap-2">
        <span style="color: #a0a0a0;" class="small">Sin platos pendientes en este momento</span>
      </div>
    </div>

    <!-- 2. TARJETAS INDIVIDUALES CON SEMÁFORO VISUAL -->
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3" id="contenedor-comandas"></div>
  </div>

  <!-- Contenedor Oculto para Ticket de Impresora -->
  <div id="area-impresion" class="ticket-print d-none"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let comandas = [];
    let audioPermitido = false;

    // Generador de audio incorporado
    function reproducirSonido() {
      if (!audioPermitido) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) { console.log(e); }
    }

    function activarAudio() {
      audioPermitido = true;
      const estado = document.getElementById('estado-audio');
      if (estado) {
        estado.className = "badge bg-success text-white";
        estado.textContent = "🔊 Sonido Activo";
      }
    }

    socket.on('nuevo-pedido', (pedido) => {
      pedido.timestamp = Date.now(); // Marca de tiempo para semáforo
      comandas.push(pedido);
      reproducirSonido();
      actualizarPantalla();
    });

    // Refrescar semáforo de tiempo cada 30 segundos
    setInterval(actualizarPantalla, 30000);

    function actualizarPantalla() {
      renderizarAcumulado();
      renderizarComandas();
    }

    // Agrupar platos iguales en el panel superior
    function renderizarAcumulado() {
      const contenedor = document.getElementById('contenedor-acumulado');
      const badgeTotal = document.getElementById('total-comandas-activas');
      
      badgeTotal.textContent = `${comandas.length} comandas activas`;

      if (comandas.length === 0) {
        contenedor.innerHTML = '<span style="color: #a0a0a0;" class="small">Sin platos pendientes en este momento</span>';
        return;
      }

      const conteo = {};
      comandas.forEach(c => {
        c.platos.forEach(p => {
          conteo[p.nombre] = (conteo[p.nombre] || 0) + p.cantidad;
        });
      });

      let html = '';
      for (const [nombre, cantidad] of Object.entries(conteo)) {
        html += `
          <div class="badge-platillo">
            <span class="badge fs-6" style="background-color: #d32f2f; color: #f5f5dc;">${cantidad}x</span>
            <span class="fw-bold">${nombre}</span>
          </div>
        `;
      }
      contenedor.innerHTML = html;
    }

    // Renderizar comandas individuales
    function renderizarComandas() {
      const contenedor = document.getElementById('contenedor-comandas');
      contenedor.innerHTML = '';

      const ahora = Date.now();

      comandas.forEach((pedido) => {
        const minutosTranscurridos = Math.floor((ahora - pedido.timestamp) / 60000);
        
        // Asignación de semáforo
        let claseSemaforo = 'tiempo-normal';
        let badgeTiempo = `<span class="badge bg-success">${minutosTranscurridos} min</span>`;

        if (minutosTranscurridos >= 15) {
          claseSemaforo = 'tiempo-urgente';
          badgeTiempo = `<span class="badge bg-danger">${minutosTranscurridos} min</span>`;
        } else if (minutosTranscurridos >= 10) {
          claseSemaforo = 'tiempo-alerta';
          badgeTiempo = `<span class="badge bg-warning text-dark">${minutosTranscurridos} min</span>`;
        }

        const col = document.createElement('div');
        col.className = 'col';

        let platosHtml = pedido.platos.map(p => `
          <li class="list-group-item item-plato d-flex justify-content-between align-items-center" 
              onclick="tacharPlato(this)" style="cursor: pointer;">
            <div>
              <strong style="color: #f59e0b;" class="fs-6">${p.cantidad}x</strong> 
              <span class="fw-bold">${p.nombre}</span>
              ${p.observacion ? `<br><small class="fw-bold" style="color: #e57373;">Nota: ${p.observacion}</small>` : ''}
            </div>
            <i class="fa-solid fa-check text-muted small"></i>
          </li>
        `).join('');

        col.innerHTML = `
          <div class="card card-pedido ${claseSemaforo} h-100">
            <div class="card-header d-flex justify-content-between align-items-center p-2" style="background-color: #282828; border-bottom: 1px solid #3d3d3d;">
              <span class="fw-bold" style="color: #f5f5dc;">#${pedido.id} - ${pedido.mesa}</span>
              ${badgeTiempo}
            </div>
            <div class="card-body p-2">
              <ul class="list-group list-group-flush mb-2">
                ${platosHtml}
              </ul>
            </div>
            <div class="card-footer bg-transparent border-0 d-flex gap-2 p-2">
              <button class="btn btn-sm btn-outline-light w-50" onclick='imprimirTicket(${JSON.stringify(pedido)})'>
                <i class="fa-solid fa-print me-1"></i> Ticket
              </button>
              <button class="btn btn-sm fw-bold w-50" style="background-color: #2e7d32; color: #white;" onclick="despacharComanda('${pedido.id}')">
                <i class="fa-solid fa-check me-1"></i> Listo
              </button>
            </div>
          </div>
        `;
        contenedor.appendChild(col);
      });
    }

    // Tachar/Destachar platos con tap/clic
    function tacharPlato(elemento) {
      elemento.classList.toggle('tachado');
    }

    // Finalizar pedido completo
    function despacharComanda(id) {
      comandas = comandas.filter(c => c.id !== id);
      actualizarPantalla();
    }

    // Impresión rápida para impresora de oficina
    function imprimirTicket(pedido) {
      const area = document.getElementById('area-impresion');
      let detalle = pedido.platos.map(p => `${p.cantidad}x ${p.nombre}\n${p.observacion ? '  Nota: ' + p.observacion + '\n' : ''}`).join('');

      area.innerHTML = `
        <div style="padding: 10px; border: 1px dashed #000;">
          <h3 style="text-align:center; margin:0;">ANITA-WOK</h3>
          <p style="text-align:center; margin:0;">---------------------------</p>
          <p><strong>Comanda:</strong> #${pedido.id}<br><strong>Ubicación:</strong> ${pedido.mesa}<br><strong>Hora:</strong> ${pedido.hora}</p>
          <p>---------------------------</p>
          <pre style="font-family: monospace; white-space: pre-wrap;">${detalle}</pre>
          <p>---------------------------</p>
          <p style="text-align:right;"><strong>Total: S/ ${pedido.total}</strong></p>
        </div>
      `;

      area.classList.remove('d-none');
      window.print();
      area.classList.add('d-none');
    }
  </script>
</body>
</html>
