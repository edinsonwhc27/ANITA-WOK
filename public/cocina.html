<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #212529; color: white; }
    .card-pedido { background-color: #2c3034; border: 2px solid #dc3545; }
    
    /* Reglas para impresora normal de oficina */
    @media print {
      body * { visibility: hidden; }
      .ticket-print, .ticket-print * { visibility: visible; }
      .ticket-print {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm; /* Simula ancho de ticket en hoja de oficina */
        color: black !important;
        font-family: monospace;
        font-size: 12px;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body onclick="activarAudio()">

  <header class="bg-danger text-white p-3 d-flex justify-content-between align-items-center no-print">
    <h1 class="h4 mb-0 fw-bold"><i class="fa-solid fa-utensils me-2"></i>Cocina - ANITA-WOK</h1>
    <div>
      <span id="estado-audio" class="badge bg-warning text-dark me-2">Clic en pantalla para activar sonido</span>
      <a href="/index.html" class="btn btn-light btn-sm fw-bold">Volver a Pedidos</a>
    </div>
  </header>

  <div class="container-fluid p-3 no-print">
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3" id="contenedor-comandas">
      <!-- Las comandas llegarán dinámicamente aquí -->
    </div>
  </div>

  <!-- Contenedor oculto para la impresión en impresora de oficina -->
  <div id="area-impresion" class="ticket-print d-none"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let audioPermitido = false;

    // Generador de sonido por síntesis web (sin depender de archivos mp3 externos)
    function reproducirSonido() {
      if (!audioPermitido) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // Tono de campana (880Hz)
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        console.log("Error de audio:", e);
      }
    }

    function activarAudio() {
      audioPermitido = true;
      const estado = document.getElementById('estado-audio');
      if (estado) {
        estado.className = "badge bg-success";
        estado.textContent = "🔊 Sonido Activo";
      }
    }

    // Escuchar comandas en tiempo real
    socket.on('nuevo-pedido', (pedido) => {
      reproducirSonido();
      renderizarComanda(pedido);
    });

    function renderizarComanda(pedido) {
      const contenedor = document.getElementById('contenedor-comandas');
      const col = document.createElement('div');
      col.className = 'col';
      col.id = `comanda-${pedido.id}`;

      let platosHtml = pedido.platos.map(p => `
        <li class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center">
          <div>
            <strong class="text-warning">${p.cantidad}x</strong> ${p.nombre}
            ${p.observacion ? `<br><small class="text-danger fw-bold">i: ${p.observacion}</small>` : ''}
          </div>
        </li>
      `).join('');

      col.innerHTML = `
        <div class="card card-pedido h-100">
          <div class="card-header bg-danger text-white d-flex justify-content-between">
            <span class="fw-bold">#${pedido.id} - ${pedido.mesa}</span>
            <small>${pedido.hora}</small>
          </div>
          <div class="card-body p-2">
            <ul class="list-group list-group-flush border-secondary mb-3">
              ${platosHtml}
            </ul>
          </div>
          <div class="card-footer bg-transparent border-secondary d-flex gap-1">
            <button class="btn btn-sm btn-outline-light w-50" onclick='imprimirTicket(${JSON.stringify(pedido)})'>
              <i class="fa-solid fa-print"></i> Imprimir
            </button>
            <button class="btn btn-sm btn-success w-50" onclick="despacharComanda('${pedido.id}')">
              <i class="fa-solid fa-check"></i> Listo
            </button>
          </div>
        </div>
      `;
      contenedor.appendChild(col);
    }

    function despacharComanda(id) {
      const elem = document.getElementById(`comanda-${id}`);
      if (elem) elem.remove();
    }

    // Impresión adaptada para impresora de oficina
    function imprimirTicket(pedido) {
      const area = document.getElementById('area-impresion');
      
      let detalle = pedido.platos.map(p => 
        `${p.cantidad}x ${p.nombre}\n${p.observacion ? '  Nota: ' + p.observacion + '\n' : ''}`
      ).join('');

      area.innerHTML = `
        <div style="padding: 10px; border: 1px dashed #000;">
          <h3 style="text-align:center; margin:0;">ANITA-WOK</h3>
          <p style="text-align:center; margin:0;">---------------------------</p>
          <p><strong>Comanda:</strong> #${pedido.id}<br>
          <strong>Ubicación:</strong> ${pedido.mesa}<br>
          <strong>Hora:</strong> ${pedido.hora}</p>
          <p>---------------------------</p>
          <pre style="font-family: monospace; white-space: pre-wrap;">${detalle}</pre>
          <p>---------------------------</p>
          <p style="text-align:right;"><strong>Total: S/ ${pedido.total}</strong></p>
        </div>
      `;

      area.classList.remove('d-none');
      window.print();
      area.classList.add('d-none');
    }
  </script>
</body>
</html>
