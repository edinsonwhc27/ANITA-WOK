<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina Inteligente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Panel Superior de Producción Acumulada */
    .panel-acumulado {
      background-color: #2b2b2b;
      border: 2px solid #ffc107;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .badge-platillo {
      font-size: 1.1rem;
      padding: 8px 12px;
      border-radius: 6px;
      background-color: #3d3d3d;
      border: 1px solid #555;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Semaforización de Tarjetas por Tiempo */
    .card-pedido { background-color: #2a2a2a; transition: all 0.3s; border: 3px solid #6c757d; }
    .tiempo-normal { border-color: #198754 !important; } /* Verde < 10 min */
    .tiempo-alerta { border-color: #ffc107 !important; } /* Amarillo 10-15 min */
    .tiempo-urgente { border-color: #dc3545 !important; animation: parpadeo 1.5s infinite; } /* Rojo > 15 min */

    @keyframes parpadeo {
      0% { box-shadow: 0 0 5px #dc3545; }
      50% { box-shadow: 0 0 20px #dc3545; }
      100% { box-shadow: 0 0 5px #dc3545; }
    }

    /* Estilo de ítem tachado al hacer clic */
    .tachado {
      text-decoration: line-through;
      opacity: 0.4;
      background-color: #198754 !important;
    }

    @media print {
      body * { visibility: hidden; }
      .ticket-print, .ticket-print * { visibility: visible; }
      .ticket-print { position: absolute; left: 0; top: 0; width: 80mm; color: black !important; font-family: monospace; font-size: 12px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body onclick="activarAudio()">

  <!-- Encabezado -->
  <header class="bg-danger text-white p-2 px-3 d-flex justify-content-between align-items-center no-print">
    <h1 class="h5 mb-0 fw-bold"><i class="fa-solid fa-fire-burner me-2"></i>COCINA ANITA-WOK</h1>
    <div>
      <span id="estado-audio" class="badge bg-warning text-dark me-2" style="font-size:0.75rem;">Clic en pantalla para activar sonido</span>
      <a href="/index.html" class="btn btn-light btn-sm fw-bold">Volver a Pedidos</a>
    </div>
  </header>

  <div class="container-fluid p-3 no-print">
    
    <!-- 1. RESUMEN EN VIVO DE PLATOS ACUMULADOS (PARA EL WOK) -->
    <div class="panel-acumulado">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0 fw-bold text-warning text-uppercase">
          <i class="fa-solid fa-layer-group me-2"></i>Total a Preparar en Wok (Acumulado Global)
        </h2>
        <span class="badge bg-secondary" id="total-comandas-activas">0 comandas activas</span>
      </div>
      <div id="contenedor-acumulado" class="d-flex flex-wrap gap-2">
        <span class="text-muted small">No hay platos pendientes en cocina</span>
      </div>
    </div>

    <!-- 2. TARJETAS INDIVIDUALES CON SEMÁFORO DE TIEMPO -->
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3" id="contenedor-comandas"></div>
  </div>

  <div id="area-impresion" class="ticket-print d-none"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let comandas = [];
    let audioPermitido = false;

    function reproducirSonido() {
      if (!audioPermitido) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) { console.log(e); }
    }

    function activarAudio() {
      audioPermitido = true;
      const estado = document.getElementById('estado-audio');
      if (estado) {
        estado.className = "badge bg-success";
        estado.textContent = "🔊 Sonido Activo";
      }
    }

    socket.on('nuevo-pedido', (pedido) => {
      pedido.timestamp = Date.now(); // Guardar hora exacta para el semáforo
      comandas.push(pedido);
      reproducirSonido();
      actualizarPantalla();
    });

    // Actualizar el Semáforo de tiempo cada 30 segundos
    setInterval(actualizarPantalla, 30000);

    function actualizarPantalla() {
      renderizarAcumulado();
      renderizarComandas();
    }

    // Calcular y mostrar los platos repetidos en la barra superior
    function renderizarAcumulado() {
      const contenedor = document.getElementById('contenedor-acumulado');
      const badgeTotal = document.getElementById('total-comandas-activas');
      
      badgeTotal.textContent = `${comandas.length} comandas activas`;

      if (comandas.length === 0) {
        contenedor.innerHTML = '<span class="text-muted small">No hay platos pendientes en cocina</span>';
        return;
      }

      // Agrupar cantidades por nombre de plato
      const conteo = {};
      comandas.forEach(c => {
        c.platos.forEach(p => {
          conteo[p.nombre] = (conteo[p.nombre] || 0) + p.cantidad;
        });
      });

      let html = '';
      for (const [nombre, cantidad] of Object.entries(conteo)) {
        html += `
          <div class="badge-platillo">
            <span class="badge bg-danger fs-6">${cantidad}x</span>
            <span class="fw-bold">${nombre}</span>
          </div>
        `;
      }
      contenedor.innerHTML = html;
    }

    // Renderizar tarjetas individuales
    function renderizarComandas() {
      const contenedor = document.getElementById('contenedor-comandas');
      contenedor.innerHTML = '';

      const ahora = Date.now();

      comandas.forEach((pedido) => {
        const minutosTranscurridos = Math.floor((ahora - pedido.timestamp) / 60000);
        
        // Determinar color de semáforo
        let claseSemaforo = 'tiempo-normal';
        if (minutosTranscurridos >= 15) {
          claseSemaforo = 'tiempo-urgente';
        } else if (minutosTranscurridos >= 10) {
          claseSemaforo = 'tiempo-alerta';
        }

        const col = document.createElement('div');
        col.className = 'col';

        let platosHtml = pedido.platos.map((p, idx) => `
          <li class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center cursor-pointer" 
              onclick="tacharPlato(this)" style="cursor: pointer;">
            <div>
              <strong class="text-warning fs-6">${p.cantidad}x</strong> ${p.nombre}
              ${p.observacion ? `<br><small class="text-danger fw-bold">i: ${p.observacion}</small>` : ''}
            </div>
            <i class="fa-solid fa-check text-muted small"></i>
          </li>
        `).join('');

        col.innerHTML = `
          <div class="card card-pedido ${claseSemaforo} h-100">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center p-2">
              <span class="fw-bold">#${pedido.id} - ${pedido.mesa}</span>
              <span class="badge bg-dark">${minutosTranscurridos} min</span>
            </div>
            <div class="card-body p-2">
              <ul class="list-group list-group-flush border-secondary mb-2">
                ${platosHtml}
              </ul>
            </div>
            <div class="card-footer bg-transparent border-secondary d-flex gap-1 p-2">
              <button class="btn btn-sm btn-outline-light w-50" onclick='imprimirTicket(${JSON.stringify(pedido)})'>
                <i class="fa-solid fa-print"></i> Ticket
              </button>
              <button class="btn btn-sm btn-success w-50 fw-bold" onclick="despacharComanda('${pedido.id}')">
                <i class="fa-solid fa-check-double"></i> Listo
              </button>
            </div>
          </div>
        `;
        contenedor.appendChild(col);
      });
    }

    // Tachar/Destachar un plato individual al tocarlo
    function tacharPlato(elemento) {
      elemento.classList.toggle('tachado');
    }

    // Finalizar comanda completa
    function despacharComanda(id) {
      comandas = comandas.filter(c => c.id !== id);
      actualizarPantalla();
    }

    // Impresión rápida
    function imprimirTicket(pedido) {
      const area = document.getElementById('area-impresion');
      let detalle = pedido.platos.map(p => `${p.cantidad}x ${p.nombre}\n${p.observacion ? '  Nota: ' + p.observacion + '\n' : ''}`).join('');

      area.innerHTML = `
        <div style="padding: 10px; border: 1px dashed #000;">
          <h3 style="text-align:center; margin:0;">ANITA-WOK</h3>
          <p style="text-align:center; margin:0;">---------------------------</p>
          <p><strong>Comanda:</strong> #${pedido.id}<br><strong>Ubicación:</strong> ${pedido.mesa}<br><strong>Hora:</strong> ${pedido.hora}</p>
          <p>---------------------------</p>
          <pre style="font-family: monospace; white-space: pre-wrap;">${detalle}</pre>
          <p>---------------------------</p>
          <p style="text-align:right;"><strong>Total: S/ ${pedido.total}</strong></p>
        </div>
      `;

      area.classList.remove('d-none');
      window.print();
      area.classList.add('d-none');
    }
  </script>
</body>
</html>
