<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina / Recepción</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .brand-header {
      background-color: #1f1f1f;
      padding: 12px 20px;
      border-bottom: 2px solid #d32f2f;
    }

    .comanda-card {
      background-color: #1e1e1e;
      border: 2px solid #d32f2f;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(211, 47, 47, 0.2);
    }

    .comanda-header {
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .item-plato {
      font-size: 1.1rem;
      font-weight: 600;
      border-bottom: 1px dashed #333;
      padding: 6px 0;
    }

    .item-obs {
      font-size: 0.95rem;
      color: #ffca28;
      font-weight: bold;
      display: block;
      margin-top: 2px;
    }

    .badge-metodo {
      font-size: 0.8rem;
      background-color: #198754;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
    }

    /* REGLAS DE IMPRESIÓN CORREGIDAS PARA EVITAR CORTE DE TEXTO EN MODO KIOSK */
    @media print {
      @page {
        margin: 0 !important;
        size: 80mm auto;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        color: #000 !important;
      }
      body * {
        visibility: hidden !important;
      }
      #ticket-impresion, #ticket-impresion * {
        visibility: visible !important;
      }
      #ticket-impresion {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .tabla-platos {
        width: 100%;
        border-collapse: collapse;
      }
      .tabla-platos td {
        padding: 1px 0 !important;
        vertical-align: top;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado de Cocina -->
  <header class="brand-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <h1 class="h4 mb-0 fw-bold text-danger"><i class="fa-solid fa-utensils me-2"></i> ANITA-WOK — COCINA</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button id="btn-activar-sonido" class="btn btn-warning btn-sm fw-bold" onclick="activarAudio()">
        <i class="fa-solid fa-volume-high me-1"></i> Activar Sonido Alerta
      </button>
      <a href="/index.html" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-receipt me-1"></i> Ir a Caja / Comandas
      </a>
    </div>
  </header>

  <div class="container-fluid p-3">
    <!-- Grid donde se cargan las comandas -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3" id="contenedor-comandas">
      <div class="col-12 text-center py-5 text-muted" id="mensaje-vacio">
        <h4><i class="fa-solid fa-clock me-2"></i> Esperando nuevas comandas...</h4>
      </div>
    </div>
  </div>

  <!-- Contenedor para la impresión -->
  <div id="ticket-impresion" style="display: none;"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    let audioPermitido = false;

    function arreglarTextoImpresion(texto) {
      if (!texto) return '';
      return String(texto)
        .replace(/á/g, 'a').replace(/Á/g, 'A')
        .replace(/é/g, 'e').replace(/É/g, 'E')
        .replace(/í/g, 'i').replace(/Í/g, 'I')
        .replace(/ó/g, 'o').replace(/Ó/g, 'O')
        .replace(/ú/g, 'u').replace(/Ú/g, 'U')
        .replace(/ñ/g, 'n').replace(/Ñ/g, 'N');
    }

    function emitirPitido() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.4);

        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
          gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.5);
        }, 200);

      } catch (e) {
        console.error("Error al reproducir el pitido:", e);
      }
    }

    function activarAudio() {
      audioPermitido = true;
      emitirPitido();
      const btn = document.getElementById('btn-activar-sonido');
      if (btn) {
        btn.className = "btn btn-success btn-sm fw-bold";
        btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Sonido Activado';
      }
    }

    function imprimirTicket(comanda) {
      const ticketContainer = document.getElementById('ticket-impresion');
      if (!ticketContainer) return;

      const listaPlatos = comanda.items || comanda.platos || [];
      let filasPlatos = '';
      let acumuladoTotal = 0;

      listaPlatos.forEach(item => {
        const nombrePlato = arreglarTextoImpresion(item.nombre || item.titulo || item.descripcion);
        
        const obsTexto = item.observacion || item.observaciones || item.obs || item.espec || item.nota || item.comentario || '';
        const obsPlato = arreglarTextoImpresion(obsTexto);
        
        const cantidad = Number(item.cantidad || 1);
        const precioUnitario = Number(item.precio || item.costo || 0);
        const subtotal = cantidad * precioUnitario;
        acumuladoTotal += subtotal;

        filasPlatos += `
          <tr>
            <td style="font-size: 13px; font-weight: 900; width: 25px; text-align: left; vertical-align: top; padding: 1px 0; color: #000 !important;">
              <strong>${cantidad}x</strong>
            </td>
            <td style="font-size: 13px; font-weight: 900; text-align: left; padding: 1px 0; color: #000 !important;">
              <div><strong>${nombrePlato}</strong></div>
              ${obsPlato ? `<div style="font-size: 12px; font-weight: 900; color: #000 !important; margin-top: 1px; text-transform: uppercase; line-height: 1.1;"><strong>>> OBS: ${obsPlato}</strong></div>` : ''}
            </td>
            <td style="font-size: 13px; font-weight: 900; text-align: right; width: 70px; vertical-align: top; padding: 1px 0; color: #000 !important;">
              ${subtotal > 0 ? `<strong>S/ ${subtotal.toFixed(2)}</strong>` : ''}
            </td>
          </tr>
        `;
      });

      const totalFinal = comanda.total ? Number(comanda.total) : acumuladoTotal;
      const ubicacionLimpia = arreglarTextoImpresion(comanda.mesa ? comanda.mesa : 'Llevar');

      ticketContainer.innerHTML = `
        <div style="width: 100%; padding: 0; margin: 0; font-family: monospace; color: #000 !important; background: #fff; line-height: 1.15; font-size: 12px;">
          <div style="text-align: center;">
            <h1 style="margin: 0; padding: 0; font-size: 16px; font-weight: 900; color: #000 !important;"><strong>ANITA-WOK</strong></h1>
          </div>
          
          <div style="border-bottom: 1px dashed #000; margin: 2px 0;"></div>

          <div style="font-size: 12px; font-weight: 900; color: #000 !important;">
            <div><strong>Comanda: #${comanda.id}</strong></div>
            <div><strong>Ubicacion: ${ubicacionLimpia}</strong></div>
            <div><strong>Hora: ${comanda.hora || ''}</strong></div>
          </div>

          <div style="border-bottom: 1px dashed #000; margin: 2px 0;"></div>

          <table class="tabla-platos">
            <tbody>
              ${filasPlatos}
            </tbody>
          </table>

          <div style="border-bottom: 1px dashed #000; margin: 2px 0;"></div>

          <div style="font-size: 15px; font-weight: 900; display: flex; justify-content: space-between; margin-top: 4px; padding-bottom: 5px; color: #000 !important;">
            <span><strong>TOTAL:</strong></span>
            <span><strong>S/ ${totalFinal.toFixed(2)}</strong></span>
          </div>

          <div style="border-bottom: 1px dashed #000; margin: 4px 0 10px 0;"></div>

          <!-- ESPACIADO FÍSICO CON TEXTO VISIBLE QUE OBLIGA AL NAVEGADOR Y A LA IMPRESORA A ARRASTRAR EL PAPEL -->
          <div style="text-align: center; margin-top: 20px; margin-bottom: 80px; font-size: 11px; font-weight: bold; color: #000 !important;">
            *** GRACIAS POR SU COMPRA ***
            <br> .
          </div>
        </div>
      `;

      ticketContainer.style.display = 'block';
      
      setTimeout(() => {
        window.print();
        setTimeout(() => {
          ticketContainer.style.display = 'none';
        }, 500);
      }, 300);
    }

    function imprimirTicketAnulacion(comanda) {
      const ticketContainer = document.getElementById('ticket-impresion');
      if (!ticketContainer) return;

      const ubicacionLimpia = arreglarTextoImpresion(comanda.mesa ? comanda.mesa : 'Llevar');

      ticketContainer.innerHTML = `
        <div style="width: 100%; padding: 0; margin: 0; font-family: monospace; color: #000 !important; background: #fff; text-align: center; line-height: 1.15;">
          <h1 style="margin: 0; padding: 0; font-size: 16px; font-weight: 900; color: #000 !important;"><strong>*** ANULADO ***</strong></h1>
          <div style="border-bottom: 2px solid #000; margin: 2px 0;"></div>
          <div style="font-size: 13px; font-weight: 900; color: #000 !important;">
            <div><strong>COMANDA: #${comanda.id}</strong></div>
            <div><strong>UBICACION: ${ubicacionLimpia}</strong></div>
          </div>
          <div style="border-bottom: 2px solid #000; margin: 2px 0;"></div>
          <div style="font-size: 15px; font-weight: 900; margin: 4px 0; color: #000 !important;">
            <strong>¡NO PREPARAR ESTE PEDIDO!</strong>
          </div>
          <div style="border-bottom: 2px solid #000; margin: 2px 0;"></div>

          <!-- ESPACIADO FÍSICO CON TEXTO VISIBLE -->
          <div style="text-align: center; margin-top: 20px; margin-bottom: 80px; font-size: 11px; font-weight: bold; color: #000 !important;">
            *** ANULACION DE PEDIDO ***
            <br> .
          </div>
        </div>
      `;

      ticketContainer.style.display = 'block';
      
      setTimeout(() => {
        window.print();
        setTimeout(() => {
          ticketContainer.style.display = 'none';
        }, 500);
      }, 300);
    }

    socket.on('nuevaComanda', (comanda) => {
      console.log("Nueva comanda recibida:", comanda);

      if (audioPermitido) {
        emitirPitido();
      }

      const msgVacio = document.getElementById('mensaje-vacio');
      if (msgVacio) msgVacio.style.display = 'none';

      const contenedor = document.getElementById('contenedor-comandas');
      const col = document.createElement('div');
      col.className = 'col';
      col.id = `comanda-${comanda.id}`;

      let itemsHTML = '';
      let totalTarjeta = 0;
      const listaPlatos = comanda.items || comanda.platos || [];
      
      listaPlatos.forEach(item => {
        const cantidad = Number(item.cantidad || 1);
        const precioUnitario = Number(item.precio || item.costo || 0);
        const subtotal = cantidad * precioUnitario;
        totalTarjeta += subtotal;

        const obsTexto = item.observacion || item.observaciones || item.obs || item.espec || item.nota || item.comentario || '';

        itemsHTML += `
          <div class="item-plato d-flex justify-content-between align-items-center">
            <div>
              <span class="badge bg-danger text-white me-1">${cantidad}x</span> ${item.nombre || item.titulo}
              ${obsTexto ? `<span class="item-obs"><i class="fa-solid fa-comment-dots me-1"></i>OBS: ${obsTexto}</span>` : ''}
            </div>
            ${subtotal > 0 ? `<span class="fw-bold text-success small ms-2">S/ ${subtotal.toFixed(2)}</span>` : ''}
          </div>
        `;
      });

      const totalMostrar = comanda.total ? Number(comanda.total) : totalTarjeta;

      let datosCliente = '';
      if (comanda.cliente && comanda.cliente.nombre) {
        datosCliente = `
          <div class="small text-info mt-2 pt-1 border-top border-secondary">
            <strong><i class="fa-solid fa-user me-1"></i>${comanda.cliente.nombre}</strong> 
            ${comanda.cliente.telefono ? `(${comanda.cliente.telefono})` : ''}<br>
            ${comanda.cliente.direccion ? `<i class="fa-solid fa-location-dot me-1"></i>${comanda.cliente.direccion}` : ''}
          </div>
        `;
      }

      col.innerHTML = `
        <div class="comanda-card">
          <div class="comanda-header d-flex justify-content-between align-items-center">
            <div>
              <span class="h5 fw-bold text-warning mb-0">${comanda.mesa}</span>
              <small class="text-muted d-block">${comanda.hora || comanda.fecha || ''}</small>
            </div>
            <span class="badge-metodo">${comanda.metodoPago || 'Efectivo'}</span>
          </div>

          <div class="comanda-body">
            ${itemsHTML}
            ${datosCliente}
          </div>

          <div class="mt-3 pt-2 border-top border-secondary d-flex justify-content-between align-items-center">
            <span class="h6 mb-0 text-white fw-bold">Total: <span class="text-success">S/ ${totalMostrar.toFixed(2)}</span></span>
            <button class="btn btn-sm btn-success fw-bold" onclick="despacharComanda('${comanda.id}')">
              <i class="fa-solid fa-check me-1"></i> Listo
            </button>
          </div>
        </div>
      `;

      contenedor.insertBefore(col, contenedor.firstChild);
      imprimirTicket(comanda);
    });

    socket.on('comandaAnulada', (comanda) => {
      console.log("Comanda anulada:", comanda);

      if (audioPermitido) {
        emitirPitido();
      }

      imprimirTicketAnulacion(comanda);

      const elem = document.getElementById(`comanda-${comanda.id}`);
      if (elem) {
        elem.innerHTML = `
          <div class="comanda-card border-danger bg-danger bg-opacity-25 text-center py-4">
            <h4 class="text-danger fw-bold"><i class="fa-solid fa-ban me-2"></i> ANULADO</h4>
            <p class="mb-0 fw-bold">Comanda #${comanda.id}</p>
          </div>
        `;
        setTimeout(() => {
          despacharComanda(comanda.id);
        }, 4000);
      }
    });

    function despacharComanda(id) {
      const elem = document.getElementById(`comanda-${id}`);
      if (elem) {
        elem.remove();
      }

      const contenedor = document.getElementById('contenedor-comandas');
      const tarjetas = contenedor.querySelectorAll('.col:not(#mensaje-vacio)');
      if (tarjetas.length === 0) {
        const msgVacio = document.getElementById('mensaje-vacio');
        if (msgVacio) msgVacio.style.display = 'block';
      }
    }
  </script>
</body>
</html>
