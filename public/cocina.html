<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .kitchen-header {
      background-color: #1e1e1e;
      border-bottom: 2px solid #d32f2f;
      padding: 12px 20px;
    }

    .grid-comandas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .comanda-card {
      background-color: #1e1e1e;
      border-radius: 8px;
      border-left: 6px solid #d32f2f;
      padding: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border 0.2s ease;
    }

    .comanda-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffeb3b;
      margin-bottom: 10px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lista-items {
      list-style: none;
      padding: 0;
      margin: 0 0 10px 0;
      flex-grow: 1;
    }

    .lista-items li {
      font-size: 0.95rem;
      padding: 4px 0;
      border-bottom: 1px dashed #333;
    }

    .acciones {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .btn-preparar {
      background-color: #ff9800;
      color: #000;
      font-weight: 600;
      border: none;
      font-size: 0.75rem;
      padding: 5px;
      flex: 1;
    }

    .btn-listo {
      background-color: #4caf50;
      color: #fff;
      font-weight: 600;
      border: none;
      font-size: 0.75rem;
      padding: 5px;
      flex: 1;
    }

    .btn-entregado {
      background-color: #f44336;
      color: #fff;
      font-weight: 600;
      border: none;
      font-size: 0.75rem;
      padding: 5px;
      flex: 1;
    }
  </style>
</head>
<body>

  <header class="kitchen-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid fa-fire text-danger fs-3"></i>
      <h1 class="h4 mb-0 fw-bold">COCINA / PEDIDOS EN CURSO</h1>
    </div>
    <a href="/" class="btn btn-outline-light btn-sm">
      <i class="fa-solid fa-arrow-left me-1"></i> Volver a Carta
    </a>
  </header>

  <main>
    <div id="contenedor-comandas" class="grid-comandas">
      <p style="color: #aaa; text-align: center; width: 100%; grid-column: 1/-1; margin-top: 50px;">
        Esperando comandas en tiempo real...
      </p>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
