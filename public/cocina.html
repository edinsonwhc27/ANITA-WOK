<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANITA-WOK - Pantalla de Cocina / Recepción</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .brand-header {
      background-color: #1f1f1f;
      padding: 12px 20px;
      border-bottom: 2px solid #d32f2f;
    }

    .comanda-card {
      background-color: #1e1e1e;
      border: 2px solid #d32f2f;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(211, 47, 47, 0.2);
    }

    .comanda-header {
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .item-plato {
      font-size: 1.1rem;
      font-weight: 600;
      border-bottom: 1px dashed #333;
      padding: 6px 0;
    }

    .item-obs {
      font-size: 0.85rem;
      color: #ffca28;
      font-weight: normal;
      display: block;
    }

    .badge-metodo {
      font-size: 0.8rem;
      background-color: #198754;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
    }

    /* CONFIGURACIÓN DE IMPRESIÓN (CON MARGEN EXTRA AL FINAL PARA CORTE AUTOMÁTICO) */
    @media print {
      body * {
        visibility: hidden !important;
      }
      html, body {
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }
      #ticket-impresion, #ticket-impresion * {
        visibility: visible !important;
      }
      #ticket-impresion {
        position: absolute;
        left: 0;
        top: 0;
        width: 76mm; /* Ocupa el ancho de la ticketera */
        padding: 2px 2px 40px 2px !important; /* El 40px abajo añade ~4cm de papel extra */
        margin: 0 !important;
        box-sizing: border-box !important;
        font-family: 'Courier New', Courier, monospace;
        color: #000;
        background-color: #fff;
      }
      @page {
        size: 80mm auto;
        margin: 0;
      }

      .caja-borde {
        border: 3px dashed #000;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
      }

      .linea-punteada {
        border-top: 2px dashed #000;
        margin: 8px 0;
      }

      /* Espaciador invisible para forzar avance de papel antes del corte de la guillotina */
      .espacio-corte {
        height: 40px; 
        display: block;
        content: " ";
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado de Cocina -->
  <header class="brand-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <h1 class="h4 mb-0 fw-bold text-danger"><i class="fa-solid fa-utensils me-2"></i> ANITA-WOK — COCINA</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button id="btn-activar-sonido" class="btn btn-warning btn-sm fw-bold" onclick="activarAudio()">
        <i class="fa-solid fa-volume-high me-1"></i> Activar Sonido Alerta
      </button>
      <a href="/index.html" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-receipt me-1"></i> Ir a Caja / Comandas
      </a>
    </div>
  </header>

  <div class="container-fluid p-3">
    <!-- Grid donde se cargan las comandas -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3" id="contenedor-comandas">
      <div class="col-12 text-center py-5 text-muted" id="mensaje-vacio">
        <h4><i class="fa-solid fa-clock me-2"></i> Esperando nuevas comandas...</h4>
      </div>
    </div>
  </div>

  <!-- Contenedor oculto para armar el ticket a imprimir -->
  <div id="ticket-impresion" style="display: none;"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    let audioPermitido = false;

    // Función para sanear caracteres especiales y tildes para la impresora
    function arreglarTextoImpresion(texto) {
      if (!texto) return '';
      return String(texto)
        .replace(/á/g, 'a')
        .replace(/Á/g, 'A')
        .replace(/é/g, 'e')
        .replace(/É/g, 'E')
        .replace(/í/g, 'i')
        .replace(/Í/g, 'I')
        .replace(/ó/g, 'o')
        .replace(/Ó/g, 'O')
        .replace(/ú/g, 'u')
        .replace(/Ú/g, 'U')
        .replace(/ñ/g, 'n')
        .replace(/Ñ/g, 'N');
    }

    function emitirPitido() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.4);

        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
          gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.5);
        }, 200);

      } catch (e) {
        console.error("Error al reproducir el pitido:", e);
      }
    }

    function activarAudio() {
      audioPermitido = true;
      emitirPitido();
      const btn = document.getElementById('btn-activar-sonido');
      if (btn) {
        btn.className = "btn btn-success btn-sm fw-bold";
        btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Sonido Activado';
      }
    }

    // FORMATO DE IMPRESIÓN CON AVANCE DE PAPEL PARA CORTE COMPLETO
    function imprimirTicket(comanda) {
      const ticketContainer = document.getElementById('ticket-impresion');
      if (!ticketContainer) return;

      // 1. Vaciado preventivo inmediato
      ticketContainer.innerHTML = '';

      const listaPlatos = comanda.items || comanda.platos || [];
      let filasPlatos = '';

      listaPlatos.forEach(item => {
        const nombrePlato = arreglarTextoImpresion(item.nombre || item.titulo);
        const obsPlato = arreglarTextoImpresion(item.observacion);
        
        // Obtención flexible del precio por plato
        const valorPrecio = item.precio !== undefined ? item.precio 
                          : item.precioUnitario !== undefined ? item.precioUnitario 
                          : item.subtotal !== undefined ? item.subtotal 
                          : item.costo !== undefined ? item.costo 
                          : item.monto !== undefined ? item.monto 
                          : item.price !== undefined ? item.price : 0;

        const precioPlato = Number(valorPrecio || 0).toFixed(2);

        filasPlatos += `
          <div style="margin-bottom: 10px;">
            <div style="font-size: 22px; font-weight: 900; line-height: 1.1;">
              ${item.cantidad || 1}x ${nombrePlato}
            </div>
            <div style="font-size: 20px; font-weight: bold; text-align: right; margin-top: 2px;">
              S/ ${precioPlato}
            </div>
            ${obsPlato ? `<div style="font-size: 18px; font-weight: bold; background: #000; color: #fff; padding: 3px 5px; margin-top: 4px;">* OBS: ${obsPlato}</div>` : ''}
          </div>
        `;
      });

      const ubicacionLimpia = arreglarTextoImpresion(comanda.mesa ? comanda.mesa : 'Llevar');
      const totalSeguro = Number(comanda.total || 0).toFixed(2);

      // 2. Inyección de HTML incluyendo el div invisible espacio-corte al final
      ticketContainer.innerHTML = `
        <div class="caja-borde">
          <div style="text-align: center;">
            <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: 1px;">ANITA-WOK</h1>
          </div>
          
          <div class="linea-punteada"></div>

          <div style="font-size: 20px; font-weight: bold; line-height: 1.3;">
            <div>Comanda: #${comanda.id}</div>
            <div>Ubicacion: ${ubicacionLimpia}</div>
            <div>Hora: ${comanda.hora || ''}</div>
          </div>

          <div class="linea-punteada"></div>

          <div>
            ${filasPlatos}
          </div>

          <div class="linea-punteada"></div>

          <div style="text-align: right; font-size: 22px; font-weight: 900; margin-top: 6px;">
            Total: S/ ${totalSeguro}
          </div>
        </div>
        <!-- Avance de papel para que la guillotina no corte el texto final -->
        <div class="espacio-corte"></div>
      `;

      ticketContainer.style.display = 'block';
      
      // 3. Impresión y limpieza garantizada
      setTimeout(() => {
        window.print();
        
        setTimeout(() => {
          ticketContainer.style.display = 'none';
          ticketContainer.innerHTML = '';
        }, 500);
      }, 300);
    }

    socket.on('nuevaComanda', (comanda) => {
      console.log("Nueva comanda recibida:", comanda);

      if (audioPermitido) {
        emitirPitido();
      }

      const msgVacio = document.getElementById('mensaje-vacio');
      if (msgVacio) msgVacio.style.display = 'none';

      const contenedor = document.getElementById('contenedor-comandas');
      const col = document.createElement('div');
      col.className = 'col';
      col.id = `comanda-${comanda.id}`;

      let itemsHTML = '';
      const listaPlatos = comanda.items || comanda.platos || [];
      listaPlatos.forEach(item => {
        const valorPrecio = item.precio !== undefined ? item.precio 
                          : item.precioUnitario !== undefined ? item.precioUnitario 
                          : item.subtotal !== undefined ? item.subtotal 
                          : item.costo !== undefined ? item.costo 
                          : item.monto !== undefined ? item.monto 
                          : item.price !== undefined ? item.price : 0;

        const precioPlatoTarjeta = Number(valorPrecio || 0).toFixed(2);

        itemsHTML += `
          <div class="item-plato d-flex justify-content-between align-items-center">
            <div>
              <span class="badge bg-danger text-white me-1">${item.cantidad || 1}x</span> ${item.nombre || item.titulo}
              ${item.observacion ? `<span class="item-obs"><i class="fa-solid fa-comment-dots me-1"></i>${item.observacion}</span>` : ''}
            </div>
            <span class="fw-bold text-light ms-2">S/ ${precioPlatoTarjeta}</span>
          </div>
        `;
      });

      let datosCliente = '';
      if (comanda.cliente && comanda.cliente.nombre) {
        datosCliente = `
          <div class="small text-info mt-2 pt-1 border-top border-secondary">
            <strong><i class="fa-solid fa-user me-1"></i>${comanda.cliente.nombre}</strong> 
            ${comanda.cliente.telefono ? `(${comanda.cliente.telefono})` : ''}<br>
            ${comanda.cliente.direccion ? `<i class="fa-solid fa-location-dot me-1"></i>${comanda.cliente.direccion}` : ''}
          </div>
        `;
      }

      const totalTarjeta = Number(comanda.total || 0).toFixed(2);

      col.innerHTML = `
        <div class="comanda-card">
          <div class="comanda-header d-flex justify-content-between align-items-center">
            <div>
              <span class="h5 fw-bold text-warning mb-0">${comanda.mesa}</span>
              <small class="text-muted d-block">${comanda.hora || comanda.fecha || ''}</small>
            </div>
            <span class="badge-metodo">${comanda.metodoPago || 'Efectivo'}</span>
          </div>

          <div class="comanda-body">
            ${itemsHTML}
            ${datosCliente}
          </div>

          <div class="mt-3 pt-2 border-top border-secondary d-flex justify-content-between align-items-center">
            <span class="fw-bold text-white">Total: S/ ${totalTarjeta}</span>
            <button class="btn btn-sm btn-success fw-bold" onclick="despacharComanda('${comanda.id}')">
              <i class="fa-solid fa-check me-1"></i> Listo
            </button>
          </div>
        </div>
      `;

      contenedor.insertBefore(col, contenedor.firstChild);
      imprimirTicket(comanda);
    });

    function despacharComanda(id) {
      const elem = document.getElementById(`comanda-${id}`);
      if (elem) {
        elem.remove();
      }

      const contenedor = document.getElementById('contenedor-comandas');
      const tarjetas = contenedor.querySelectorAll('.col:not(#mensaje-vacio)');
      if (tarjetas.length === 0) {
        const msgVacio = document.getElementById('mensaje-vacio');
        if (msgVacio) msgVacio.style.display = 'block';
      }
    }
  </script>
</body>
</html>
