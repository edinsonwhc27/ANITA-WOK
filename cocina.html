<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Cocina - Comandas</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #212529; color: white; padding: 15px; }
    h1 { text-align: center; margin-bottom: 20px; color: #f8f9fa; border-bottom: 2px solid #495057; padding-bottom: 10px; }
    
    /* Contenedor de fichas de comandas */
    #contenedor-comandas { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
    
    /* Ficha individual de comanda */
    .comanda-card { background: #343a40; border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); border-left: 6px solid #ffc107; }
    .comanda-card.en-preparacion { border-left-color: #17a2b8; }
    .comanda-card.listo { border-left-color: #28a745; opacity: 0.8; }

    .header-comanda { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid #495057; padding-bottom: 5px; }
    .hora { font-size: 14px; color: #adb5bd; }
    
    .lista-items { list-style: none; margin-bottom: 15px; min-height: 60px; }
    .lista-items li { padding: 4px 0; font-size: 16px; border-bottom: 1px dashed #495057; }

    .acciones { display: flex; flex-direction: column; gap: 8px; }
    .btn { border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
    .btn-preparar { background-color: #17a2b8; color: white; }
    .btn-listo { background-color: #28a745; color: white; }
    .btn-entregado { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

  <h1>👨‍🍳 Pantalla de Cocina / Pedidos</h1>

  <div id="contenedor-comandas">
    <p style="color: #adb5bd;">Esperando comandas...</p>
  </div>

  <!-- Conexión a la librería Socket.io en tiempo real -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
